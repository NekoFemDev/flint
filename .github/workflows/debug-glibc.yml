# debug-glibc — TEMPORARY pre-flight across glibc generations.
# Dispatch manually; removed once the realpath guard fix is verified.
name: debug-glibc

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          gcc --version | head -1
          ldd --version | head -1

      - name: Warning-free build (-Werror)
        run: |
          make clean
          make CFLAGS='-O2 -std=c99 -Wall -Wextra -Werror -I include'

      - name: Full test suite
        run: make test

      - name: Include-path probes (realpath + fortify)
        run: |
          ./build/flint run tests/sum.flt
          ./build/flint run tests/libdemo.flt | head -1
