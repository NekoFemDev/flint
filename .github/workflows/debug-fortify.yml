# debug-fortify — TEMPORARY pre-flight for the glibc fortify fix
# (realpath __realpath_chk abort). Dispatch manually; removed once the
# fix is verified on Ubuntu.
name: debug-fortify

on:
  workflow_dispatch:

jobs:
  gcc-fortify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Warning-free build (-Werror)
        run: |
          make clean
          make CFLAGS='-O2 -std=c99 -Wall -Wextra -Werror -I include'

      - name: Full test suite
        run: make test

      - name: Include-path probes (fortify)
        run: |
          ./build/flint run tests/sum.flt
          ./build/flint run tests/libdemo.flt
          ./build/flint check tests/sum.flt
